experiment:
  name: rc_baseline_bo
  circuit: rc_lowpass
  method: bo
  seed: 0
  simulation_budget: 20
  output_dir: research_runs/task2_bo
  resume: false
  timeout: 30
search_space:
  resistance:
    type: float
    low: 100
    high: 100000
    log: true
  capacitance:
    type: float
    low: 1e-10
    high: 1e-5
    log: true
objectives:
  bandwidth:
    type: target
    target: 10000
constraints: {}
success_criterion:
  metric: bandwidth
  relative_error_threshold: 0.05
optimizer_config:
  initial_random_points: 5
  candidate_pool_size: 512
  exploration_xi: 0.01
  noise: 1e-8
ngspice_config:
  executable: ngspice
  start_frequency_hz: 0.01
  stop_frequency_hz: 100000000
  points_per_decade: 40
pvt_config: {}
